# Ablation: Pretrained ResNet34 U-Net WITHOUT CLAHE
# Purpose: Quantifies how much local contrast enhancement contributes to boundary localization.

name: "ablation_unet_r34_no_clahe"
seed: 42
device: "auto"

data:
  train_split: "data/splits/train.txt"
  val_split: "data/splits/val.txt"
  test_split: "data/splits/test.txt"
  target_size: 512
  choroid_pixel_val: 160
  mask_tolerance: 0
  compute_boundary_weights: false
  normalize_mean: 0.485
  normalize_std: 0.229
  num_workers: 0

preprocess:
  use_clahe: false  # CLAHE disabled
  denoise_method: null

model:
  model_type: "unet"
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 1
  classes: 1
  decoder_attention_type: null

training:
  batch_size: 8
  epochs: 20
  lr: 0.0003
  min_lr: 0.000001
  weight_decay: 0.0001
  early_stopping_patience: 5
  bce_weight: 1.0
  dice_weight: 1.0

thickness:
  um_per_px: null
  n_sectors: 4
  smooth_window: 31
  poly_order: 2

threshold: 0.5
output_dir: "outputs"

